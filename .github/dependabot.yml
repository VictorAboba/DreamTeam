version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # minor and patch releases together; a major release comes as a pull request of its own, so one
      # incompatible package doesn't hold back all the others
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # anthropic 2.x moves to API version 2026-10-21 (Bearer auth, no sampling parameters): it needs the
      # migration in its own pull request, not a version bump
      - dependency-name: anthropic
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
