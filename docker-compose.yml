# Run DreamTeam inside Docker (the hub asks for a token, see DREAMTEAM_HUB_TOKEN_SHA256 below):
#   export DREAMTEAM_HUB_TOKEN=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
#   export DREAMTEAM_HUB_TOKEN_SHA256=$(python3 -c "import hashlib, os; print(hashlib.sha256(os.environ['DREAMTEAM_HUB_TOKEN'].encode()).hexdigest())")
#   SWARM_DIR=./dreamteam-home docker compose up --build
#   then open http://127.0.0.1:8765/?token=<the token>
# (PowerShell: $env:DREAMTEAM_HUB_TOKEN = python -c "import secrets; print(secrets.token_urlsafe(32))", then
#  $env:DREAMTEAM_HUB_TOKEN_SHA256 = python -c "import hashlib, os; print(hashlib.sha256(os.environ['DREAMTEAM_HUB_TOKEN'].encode()).hexdigest())")
# (or simply: dreamteam sandbox ./dreamteam-home, which makes a new token at every start)
services:
  dreamteam:
    build: .
    image: dreamteam:latest
    # as `dreamteam sandbox`: no program in the container gains privileges through a set-user-ID bit or file capabilities
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    volumes:
      - "${SWARM_DIR:-./myswarm}:/swarm"
      # skills: the host's library, read-only (`dreamteam sandbox` adds this itself; the folder must exist)
      # - "${HOME}/.dreamteam/skills:/dreamteam/host-skills:ro"
      # skills' dependency environments: a named volume (`dreamteam sandbox` uses dreamteam-skill-envs-<hash>;
      # `docker volume rm` it to reset them; declare it under a top-level `volumes:` key)
      # - "dreamteam-skill-envs:/dreamteam/skill-envs"
    environment:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_BASE_URL
      - ANTHROPIC_AUTH_TOKEN
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      # the URL the board is reached at from the host (shown as the MCP URL, written to hub.json)
      - DREAMTEAM_PUBLIC_URL=http://127.0.0.1:${PORT:-8765}
      # the SHA-256 of the hub token, from the host (see the top of this file): the hub listens on 0.0.0.0 in the
      # container, so the other containers of its network reach it, and the agents' commands reach it from the
      # container's loopback; with a token all of them need it. The container gets only this digest, never the token
      # itself (as with `dreamteam sandbox`, which makes a token per start). Without it the hub does not start and
      # says why (`docker compose logs`); `docker compose ps`, `logs` and `down` work without it. The host's
      # `dreamteam console/tui/mcp/status` send DREAMTEAM_HUB_TOKEN, the board opens with
      # http://127.0.0.1:8765/?token=<token>.
      - DREAMTEAM_HUB_TOKEN_SHA256
      # skills: the mounted host library is the read-only source "host-library"; the sandbox's own library is
      # inside the mounted home (the host never reads it by itself)
      # - DREAMTEAM_HOST_SKILLS_DIR=/dreamteam/host-skills
      # - DREAMTEAM_SKILLS_DIR=/swarm/.dreamteam/skills-library
      # - DREAMTEAM_SKILL_ENVS_DIR=/dreamteam/skill-envs
      # - UV_CACHE_DIR=/dreamteam/skill-envs/.cache/uv
      # sessions without network ([swarm] network = "off"): the firewall that cuts their agents' commands off
      # (`dreamteam sandbox` adds both itself when a session needs it; DreamTeam drops NET_ADMIN right after)
      # - DREAMTEAM_OFFLINE_FIREWALL=1
    # cap_add: ["NET_ADMIN"]
    # the hub always listens on 8765 inside the container, whatever dreamteam.toml says.
    # SWARM_DIR is a DreamTeam home (sessions page); for a single project made by `dreamteam init` use
    # command: ["run", "/swarm", "--host", "0.0.0.0", "--port", "8765", "--no-console"]
    command: ["serve", "/swarm", "--host", "0.0.0.0", "--port", "8765", "--no-console", "--no-browser"]
