<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamTeam</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/traces.css">
  <link rel="stylesheet" href="/static/icons.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 7 6.5 24h19z' fill='none' stroke='%2385858d' stroke-width='2.4' stroke-linejoin='round'/><circle cx='16' cy='7' r='5.2' fill='%23d97757'/><circle cx='6.5' cy='24' r='5.2' fill='%2385858d'/><circle cx='25.5' cy='24' r='5.2' fill='%2385858d'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
      <div class="brand-text">
        <div class="brand-name">DreamTeam</div>
        <div class="swarm-name" id="swarm-name"></div>
        <a class="back-link hidden" id="back-link" href="/">← <span data-i18n="sessions"></span></a>
      </div>
    </div>
    <button class="icon-btn team-btn" id="team-btn" type="button" data-i18n-title="team"><i class="ic ic-users"></i><span class="unread hidden" id="team-unread"></span></button>
    <button class="goal" id="goal-btn" type="button">
      <span class="goal-label" data-i18n="goal"></span>
      <span class="goal-title" id="goal-title"></span>
      <span class="badge" id="goal-status"></span>
    </button>
    <div class="top-stats">
      <div class="stat" data-i18n-title="budget_hint">
        <div class="stat-row"><span data-i18n="budget"></span><b id="budget-text"></b></div>
        <div class="meter"><div id="budget-bar"></div></div>
      </div>
      <div class="stat compact"><div class="stat-row"><span data-i18n="agents"></span><b id="agents-count"></b></div></div>
      <button class="btn" id="pause-btn" type="button"></button>
      <button class="icon-btn" id="settings-btn" type="button" data-i18n-title="settings"><i class="ic ic-gear"></i></button>
      <button class="icon-btn" id="lang-btn" type="button" data-i18n-title="language">RU</button>
      <button class="icon-btn" id="theme-btn" type="button" data-i18n-title="theme"><i class="ic ic-contrast"></i></button>
      <span class="conn" id="conn" role="status"></span>
    </div>
  </header>

  <div class="stopped-banner hidden" id="stopped-banner"><span data-i18n="session_stopped"></span><button class="btn small primary" id="start-session-btn" type="button" data-i18n="start_session"></button></div>
  <div class="paused-banner hidden" id="workspace-banner" role="alert"></div>
  <div class="paused-banner hidden" id="paused-banner"></div>
  <div class="conn-banner hidden" id="conn-banner" role="alert"></div>

  <div class="layout">
    <main class="main">
      <nav class="tabs" id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="board" class="active"><span data-i18n="tab_board"></span></button>
        <button type="button" role="tab" data-tab="feed"><span data-i18n="tab_feed"></span></button>
        <button type="button" role="tab" data-tab="files"><span data-i18n="tab_files"></span></button>
        <button type="button" role="tab" data-tab="mcp"><span data-i18n="tab_mcp"></span><span class="tab-badge warn hidden" id="mcp-badge"></span></button>
        <button type="button" role="tab" data-tab="triggers"><span data-i18n="tab_triggers"></span><span class="tab-badge hidden" id="triggers-badge"></span></button>
        <button type="button" role="tab" data-tab="jobs"><span data-i18n="tab_jobs"></span><span class="tab-badge hidden" id="jobs-badge"></span></button>
        <button type="button" role="tab" data-tab="traces"><span data-i18n="tab_traces"></span></button>
        <div class="tabs-spacer"></div>
        <input class="search" id="search" type="search" data-i18n-placeholder="search">
        <button class="btn primary new-task" id="new-task-btn" type="button" data-i18n="new_task"></button>
      </nav>
      <section class="tab-pane board-pane" id="pane-board"><div class="board" id="board"></div></section>
      <section class="tab-pane hidden" id="pane-feed"><div class="feed" id="feed"></div></section>
      <section class="tab-pane hidden" id="pane-files">
        <div class="files-head" id="workspace-info"></div>
        <div class="files">
          <div class="file-tree"><div class="crumbs" id="crumbs"></div><div id="file-list"></div></div>
          <div class="file-view">
            <div class="file-head"><div class="file-path" id="file-path"></div><button class="btn small hidden" id="file-mode" type="button"></button></div>
            <pre id="file-content"></pre><div class="file-md hidden" id="file-md"></div>
          </div>
        </div>
      </section>
      <section class="tab-pane hidden" id="pane-mcp"><div id="mcp-list" class="cards-list"></div></section>
      <section class="tab-pane hidden" id="pane-triggers"><div id="trigger-list" class="cards-list"></div></section>
      <section class="tab-pane hidden" id="pane-jobs"><div id="job-list" class="cards-list"></div></section>
      <section class="tab-pane traces-pane hidden" id="pane-traces"></section>
    </main>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h2 data-i18n="team"></h2>
        <button class="btn small hire-btn" id="hire-btn" type="button" data-i18n="hire"></button>
        <button class="icon-btn small team-toggle" id="team-toggle" type="button">»</button>
        <button class="icon-btn small team-close" id="team-close" type="button" data-i18n-title="close"><i class="ic ic-close"></i></button>
      </div>
      <button class="agent broadcast" id="broadcast-btn" type="button" data-i18n-title="broadcast_hint">
        <span class="avatar-wrap"><span class="avatar all">∗</span></span>
        <span class="agent-info"><span class="agent-name" data-i18n="everyone"></span><span class="agent-role" data-i18n="broadcast_hint"></span></span>
      </button>
      <div id="agent-list"></div>
      <div class="mcp-hint" id="mcp-hint"></div>
    </aside>
  </div>

  <!-- chat drawer -->
  <div class="drawer hidden" id="drawer" role="complementary">
    <div class="drawer-head">
      <div class="drawer-title" id="drawer-title"></div>
      <button class="icon-btn" id="drawer-close" type="button" data-i18n-title="close"><i class="ic ic-close"></i></button>
    </div>
    <div class="drawer-jobs hidden" id="drawer-jobs"></div>
    <div class="drawer-tabs">
      <button type="button" data-dtab="chat" class="active" data-i18n="chat"></button>
      <button type="button" data-dtab="activity" data-i18n="activity"></button>
    </div>
    <div class="drawer-body" id="drawer-chat"><div class="messages" id="messages"></div></div>
    <div class="drawer-body hidden" id="drawer-activity"><div class="activity" id="activity"></div></div>
    <form class="composer" id="composer">
      <textarea id="composer-text" rows="2" data-i18n-placeholder="type_message"></textarea>
      <button class="btn primary" type="submit" data-i18n="send"></button>
    </form>
  </div>

  <!-- modal -->
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/highlight.js"></script>
  <script src="/static/markdown.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/traces.js"></script>
</body>
</html>
