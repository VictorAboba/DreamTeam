[project]
name = "dreamteam"
version = "0.1.0"
description = "A self-organizing swarm of AI agents with no leader: a shared task board, git workspace, messages, triggers, agents that write their own MCP tools, and the swarm itself as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai-agents", "multi-agent", "agent-swarm", "llm", "mcp", "claude", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=2.3,<3",
    "anthropic>=1.12,<2",
    "openai>=3.26,<4",
    "starlette>=0.48",
    "uvicorn>=0.31",
    "httpx2>=2.10",
    "websockets>=13",
    "prompt-toolkit>=3.0.43",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/VictorAboba/DreamTeam"
Documentation = "https://github.com/VictorAboba/DreamTeam/blob/master/docs/en/README.md"
Issues = "https://github.com/VictorAboba/DreamTeam/issues"

[project.scripts]
dreamteam = "dreamteam.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamteam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
