[project]
name = "dreamteam"
version = "0.1.0"
description = "DreamTeam — фреймворк самоорганизующегося роя ИИ-агентов: доска задач, общий workspace, личные сообщения, триггеры, MCP-мастерская и сам рой как MCP-сервер"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "anthropic>=1.12,<2",
    "openai>=3.26,<4",
    "starlette>=0.48",
    "uvicorn>=0.31",
    "httpx2>=2.10",
    "websockets>=13",
    "prompt-toolkit>=3.0.43",
    "rich>=13.7",
]

[project.scripts]
dreamteam = "dreamteam.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamteam"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
