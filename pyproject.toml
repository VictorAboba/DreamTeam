[project]
name = "dreamteam"
version = "0.1.0"
description = "A self-organizing swarm of AI agents with no leader: a shared task board, git workspace, messages, triggers, agents that write their own MCP tools, and the swarm itself as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai-agents", "multi-agent", "agent-swarm", "llm", "mcp", "claude", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=2.3,<3",
    "anthropic>=1.17.0,<2",
    "openai>=3.41.0,<4",
    "starlette>=1.10.0",
    "uvicorn>=0.31",
    "httpx2>=2.16.0",
    "websockets>=17.3",
    "prompt-toolkit>=3.0.43",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/VictorAboba/DreamTeam"
Documentation = "https://github.com/VictorAboba/DreamTeam/blob/master/docs/en/README.md"
Issues = "https://github.com/VictorAboba/DreamTeam/issues"

[project.scripts]
dreamteam = "dreamteam.cli:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamteam"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# what CI enforces: syntax errors and undefined names. More rule families are added one at a time, each with the
# cleanup that makes it pass (good first issues).
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
